[project]
name = "raggate-ai"
version = "0.1.0"
description = "An automated evaluation harness and regression gate for production RAG pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "deepeval>=2.0",
    "openai>=1.40",
    "ragas>=0.4.3",
    "langchain-community==0.4.1",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]


[project.scripts]
raggate = "raggate.__main__:main"
raggate-dataset = "raggate.dataset.cli:main"
raggate-retrieval = "raggate.harness.cli:main"
raggate-generation = "raggate.harness.generation_cli:main"
raggate-gate = "raggate.gate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raggate"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
markers = ["live: tests that call external APIs (require OPENAI_API_KEY)",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
