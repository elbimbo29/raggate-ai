name: Eval Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run retrieval eval and gate
        id: eval
        continue-on-error: true
        run: |
          uv run python scripts/ci_eval.py | tee /tmp/eval-output.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/eval-output.txt', 'utf8');
            const result = JSON.parse(fs.readFileSync('/tmp/eval-result.json', 'utf8'));

            const status = result.passed ? '✅ **Gate passed**' : '❌ **Gate failed**';

            let body = `${status}\n\n`;
            body += '```\n' + output + '\n```\n\n';

            if (!result.passed) {
              body += '**Regressions:**\n\n';
              for (const r of result.regressions) {
                if (r.threshold > 0) {
                  body += `- \`${r.metric}\`: ${r.baseline.toFixed(4)} → ${r.candidate.toFixed(4)} (Δ ${r.delta.toFixed(4)}, threshold ${r.threshold})\n`;
                }
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail if gate failed
        if: steps.eval.outputs.exit_code != '0'
        run: exit 1